<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#20211F" rx="32"/>
  <!-- Elegant geometric architectural motif -->
  <g transform="translate(60, 60)" stroke="#A78058" stroke-width="6" fill="none">
    <!-- Arch / Dar silhouette -->
    <path d="M 40 240 L 40 140 A 100 100 0 0 1 240 140 L 240 240" stroke-linecap="round"/>
    <!-- Central apex column / atelier compass -->
    <line x1="140" y1="40" x2="140" y2="240" stroke="#D8C9B5" stroke-width="4"/>
    <!-- Subtle horizontal architectural baseline -->
    <line x1="20" y1="240" x2="260" y2="240" stroke="#A78058" stroke-width="6" stroke-linecap="round"/>
    <!-- Inner diamond accent -->
    <polygon points="140,110 165,140 140,170 115,140" fill="#A78058" fill-opacity="0.3" stroke="#D8C9B5" stroke-width="3"/>
  </g>
</svg>
